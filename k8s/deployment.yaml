apiVersion: apps/v1
kind: Deployment
metadata:
  name: vocabulary-api
spec:
  # The current S3 source is rewritten as a whole object. Keep one writer pod.
  replicas: 1
  revisionHistoryLimit: 3
  # Recreate avoids overlapping writer pods during an S3 object update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vocabulary-api
  template:
    metadata:
      labels:
        app: vocabulary-api
    spec:
      serviceAccountName: vocabulary-api
      containers:
        - name: backend
          image: docker.io/yuvarajengineer/vocabulary-api:master
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DICTIONARY_SOURCE
              value: s3
            - name: DICTIONARY_S3_BUCKET
              value: dictionary-2026
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-access-key-id
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret-access-key
                  key: AWS_SECRET_ACCESS_KEY
            - name: DICTIONARY_S3_KEY
              value: dictionary.json
            - name: STATS_S3_KEY
              value: stats.json
            - name: AWS_REGION
              value: us-east-1
            - name: APP_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: vocabulary-api-config
                  key: APP_CORS_ALLOWED_ORIGINS
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
