name: Terraform EAC Chaos Creation

on:
  push:
    branches:
      - mainx  # Change this to your main branch name if different
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-eac-apply]
    
jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.16.6

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: AWS 
      shell: bash
      run: |
        env
        aws s3 ls

    - name: Terraform Init
      run: terraform init -upgrade

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      env:
        TF_LOG: DEBUG
      run: | 
        # terraform plan -out=tfplan
        set +e
        terraform plan -detailed-exitcode -out=tfplan
        EXIT_CODE=$?
        set -e
        
        if [ $EXIT_CODE -eq 1 ]; then
          echo "Terraform plan failed with an error."
          exit 1
        elif [ $EXIT_CODE -eq 2 ]; then
          echo "Changes detected, plan saved successfully."
        else
          echo "No changes detected."
        fi

    - name: Terraform Apply
      run: terraform apply --auto-approve

    - name: Archive Terraform Plan
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: terraform/tfplan
