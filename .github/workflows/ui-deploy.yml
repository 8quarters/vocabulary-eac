name: Deploy Vocabulary UI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve latest UI release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/8quarters/vocabulary-app/releases/latest)"
          tag_name="$(jq -er '.tag_name | select(type == "string" and length > 0)' <<< "$release_json")"
          zip_asset_count="$(jq '[.assets[] | select(.name | ascii_downcase | endswith(".zip"))] | length' <<< "$release_json")"

          if [[ "$zip_asset_count" -ne 1 ]]; then
            echo "Expected exactly one ZIP asset in the latest release ($tag_name); found $zip_asset_count." >&2
            exit 1
          fi

          asset_url="$(jq -er '[.assets[] | select(.name | ascii_downcase | endswith(".zip"))][0].browser_download_url' <<< "$release_json")"
          {
            echo "tag_name=$tag_name"
            echo "asset_url=$asset_url"
          } >> "$GITHUB_OUTPUT"

      - name: Download and extract UI release
        env:
          ASSET_URL: ${{ steps.release.outputs.asset_url }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/vocabulary-ui-${RELEASE_TAG}.zip"
          extract_dir="$RUNNER_TEMP/vocabulary-ui-release"
          mkdir -p "$extract_dir"
          curl --fail --silent --show-error --location "$ASSET_URL" --output "$archive"
          unzip -tq "$archive"
          unzip -q "$archive" -d "$extract_dir"

          mapfile -d '' -t entries < <(find "$extract_dir" -mindepth 1 -maxdepth 1 -print0)
          if [[ "${#entries[@]}" -eq 1 && -d "${entries[0]}" ]]; then
            content_dir="${entries[0]}"
          else
            content_dir="$extract_dir"
          fi

          if [[ -z "$(find "$content_dir" -mindepth 1 -print -quit)" ]]; then
            echo "The ZIP asset from $RELEASE_TAG contains no files to deploy." >&2
            exit 1
          fi

          echo "CONTENT_DIR=$content_dir" >> "$GITHUB_ENV"
          echo "Deploying release $RELEASE_TAG"

      - name: Upload UI files to S3
        shell: bash
        run: |
          set -euo pipefail

          bucket_names="$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'vocabulary-dev-ui-')].Name" \
            --output text)"
          if [[ -z "$bucket_names" || "$bucket_names" == "None" ]]; then
            echo "No S3 bucket with prefix vocabulary-dev-ui- was found." >&2
            exit 1
          fi

          read -r -a buckets <<< "$bucket_names"
          if [[ "${#buckets[@]}" -ne 1 ]]; then
            echo "Expected exactly one S3 bucket with prefix vocabulary-dev-ui-; found ${#buckets[@]}." >&2
            exit 1
          fi

          echo "Uploading extracted UI files to s3://${buckets[0]}/"
          aws s3 sync "$CONTENT_DIR/" "s3://${buckets[0]}/"